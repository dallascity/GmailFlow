<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Ana Zarf Gövdesi Gradyanı -->
    <linearGradient id="envBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Kırmızı Kapak Gradyanı -->
    <linearGradient id="redFlap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B4B" />
      <stop offset="100%" stop-color="#D93025" />
    </linearGradient>

    <!-- Mavi Sağ Kanat Gradyanı -->
    <linearGradient id="blueSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1A73E8" />
    </linearGradient>

    <!-- Akış Dalgaları (Turkuaz-Mavi) -->
    <linearGradient id="flowCyan" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <!-- Akış Dalgaları (Kırmızı-Turuncu) -->
    <linearGradient id="flowRed" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <!-- Yumuşak Gölge Efekti -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Arka Plan Dişli Çark Detayları (Otomasyon Vurgusu) -->
  <g fill="#64748B" opacity="0.28">
    <!-- Sağ Üst Dişli -->
    <path d="M356 145 l8-14 14 4 4 14-8 14 10 10 14-8 14 4 4 14-8 14 6 12 16 2 4 14-12 10-12-6-10 10 6 12-10 12-14-4-2-16-12-6-14 8-12-10 4-14 14-4 2-14-10-10-14 8-12-10 4-14 14-4z" />
    <circle cx="382" cy="188" r="18" fill="none" stroke="#64748B" stroke-width="10" />
    <!-- Sağ Alt Küçük Dişli -->
    <circle cx="348" cy="340" r="22" fill="none" stroke="#64748B" stroke-width="10" stroke-dasharray="10 6" />
  </g>

  <!-- Arka Akış Dalgaları (Zarfın Arkasından Geçen) -->
  <path d="M 65 260 C 110 340, 220 330, 310 270 C 375 225, 425 225, 465 245" fill="none" stroke="url(#flowCyan)" stroke-width="16" stroke-linecap="round" />
  <path d="M 85 285 C 140 365, 245 350, 330 295 C 390 255, 430 260, 455 275" fill="none" stroke="url(#flowCyan)" stroke-width="8" stroke-linecap="round" opacity="0.8" />

  <!-- Zarf Grubu (Hafif Eğimli ve Gölgeli) -->
  <g transform="translate(230, 225) rotate(-14) translate(-230, -225)" filter="url(#dropShadow)">
    <!-- Zarf Ana Gövdesi -->
    <rect x="115" y="135" width="230" height="175" rx="22" fill="url(#envBody)" />
    
    <!-- Mavi Sağ Şerit / Kanat -->
    <path d="M 295 135 L 323 135 C 335 135, 345 145, 345 157 L 345 288 C 345 300, 335 310, 323 310 L 295 310 Z" fill="url(#blueSide)" />
    
    <!-- Zarf Alt Katlama Çizgileri -->
    <path d="M 122 303 L 210 225 M 338 303 L 250 225" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round" />

    <!-- Kırmızı Üst Kapak (M Formu) -->
    <path d="M 115 157 C 115 145, 125 135, 137 135 L 152 135 L 230 202 L 308 135 L 323 135 C 335 135, 345 145, 345 157 L 345 176 L 230 268 L 115 176 Z" fill="url(#redFlap)" />
  </g>

  <!-- Ön Akış Dalgaları ve Oklar (Zarfın Önünden Geçen) -->
  <!-- Turkuaz Ön Dalga + Ok Ucu -->
  <path d="M 75 235 C 95 315, 200 345, 315 285 C 375 253, 420 260, 455 280" fill="none" stroke="url(#flowCyan)" stroke-width="12" stroke-linecap="round" />
  <polygon points="468,287 444,267 448,292" fill="#38BDF8" />

  <!-- Kırmızı Dinamik Akış Çizgisi + Ok Ucu -->
  <path d="M 95 270 C 145 340, 235 320, 305 265 C 355 225, 405 215, 445 222" fill="none" stroke="url(#flowRed)" stroke-width="10" stroke-linecap="round" />
  <polygon points="460,225 436,210 439,234" fill="#F43F5E" />

  <!-- Küçük Veri Parçacıkları (Toplu Gönderim Hissi) -->
  <circle cx="155" cy="318" r="5" fill="#38BDF8" />
  <circle cx="172" cy="323" r="3.5" fill="#F43F5E" />
  <circle cx="378" cy="242" r="4.5" fill="#38BDF8" />
  <circle cx="395" cy="240" r="3" fill="#FFFFFF" />
  <circle cx="412" cy="272" r="4" fill="#38BDF8" />
</svg>